<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architect.dev | Software Architect &amp; Full Stack Developer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              /* Dark Mode Colors */
              'secondary-fixed': '#dae2ff',
              'tertiary-fixed': '#ebdcff',
              'inverse-surface': '#e5e2e1',
              'on-secondary': '#002b74',
              'on-tertiary-container': '#321f54',
              'inverse-primary': '#6349c0',
              'on-error-container': '#ffdad6',
              'surface-container-highest': '#353534',
              primary: '#cbbeff',
              background: '#131313',
              'on-background': '#e5e2e1',
              'on-secondary-fixed-variant': '#003fa3',
              outline: '#918fa1',
              'tertiary-fixed-dim': '#d3bcfc',
              'surface-tint': '#cbbeff',
              secondary: '#b2c5ff',
              'on-tertiary-fixed': '#230f45',
              'on-surface': '#e5e2e1',
              'surface-variant': '#353534',
              'on-primary-fixed': '#1e0061',
              tertiary: '#d3bcfc',
              'surface-bright': '#393939',
              surface: '#131313',
              error: '#ffb4ab',
              'on-tertiary': '#38265b',
              'secondary-container': '#045add',
              'on-secondary-container': '#d7dfff',
              'on-primary-fixed-variant': '#4a2ea7',
              'error-container': '#93000a',
              'on-surface-variant': '#c7c4d8',
              'primary-fixed-dim': '#cbbeff',
              'outline-variant': '#464555',
              'on-tertiary-fixed-variant': '#503d73',
              'primary-container': '#967ef7',
              'on-primary': '#330b91',
              'on-error': '#690005',
              'surface-container': '#201f1f',
              'on-secondary-fixed': '#001849',
              'inverse-on-surface': '#313030',
              'primary-fixed': '#e7deff',
              'surface-dim': '#131313',
              'surface-container-lowest': '#0e0e0e',
              'surface-container-low': '#1c1b1b',
              'secondary-fixed-dim': '#b2c5ff',
              'on-primary-container': '#2c0086',
              'tertiary-container': '#9c86c3',
              'surface-container-high': '#2a2a2a'
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem'
            },
            fontFamily: {
              headline: ['Manrope'],
              body: ['Inter'],
              label: ['Inter']
            }
          }
        }
      }
      
      /* Light mode color overrides */
      const lightModeColors = {
        'secondary-fixed': '#001849',
        'tertiary-fixed': '#230f45',
        'inverse-surface': '#313030',
        'on-secondary': '#e5dfff',
        'on-tertiary-container': '#ece0ff',
        'inverse-primary': '#9670d6',
        'on-error-container': '#410e0b',
        'surface-container-highest': '#dddcdb',
        primary: '#6349c0',
        background: '#fffbfe',
        'on-background': '#1c1b1f',
        'on-secondary-fixed-variant': '#3d4ba8',
        outline: '#79747e',
        'tertiary-fixed-dim': '#d3bcfc',
        'surface-tint': '#6349c0',
        secondary: '#4c63d2',
        'on-tertiary-fixed': '#ece0ff',
        'on-surface': '#1c1b1f',
        'surface-variant': '#e8e0eb',
        'on-primary-fixed': '#ece0ff',
        tertiary: '#7d5b8f',
        'surface-bright': '#fffbfe',
        surface: '#fffbfe',
        error: '#b3261e',
        'on-tertiary': '#ece0ff',
        'secondary-container': '#d7e3ff',
        'on-secondary-container': '#001849',
        'on-primary-fixed-variant': '#3d2e75',
        'error-container': '#f9dedc',
        'on-surface-variant': '#49454f',
        'primary-fixed-dim': '#cbbeff',
        'outline-variant': '#cac7d0',
        'on-tertiary-fixed-variant': '#3d2e75',
        'primary-container': '#eaddff',
        'on-primary': '#ffffff',
        'on-error': '#ffffff',
        'surface-container': '#f3eff4',
        'on-secondary-fixed': '#e5dfff',
        'inverse-on-surface': '#f4ede7',
        'primary-fixed': '#1e0061',
        'surface-dim': '#ded8dd',
        'surface-container-lowest': '#ffffff',
        'surface-container-low': '#f7f2f7',
        'secondary-fixed-dim': '#b2c5ff',
        'on-primary-container': '#1e0061',
        'tertiary-container': '#f0daff',
        'surface-container-high': '#e8e1e6'
      }
      
      function applyLightModeColors() {
        const root = document.documentElement
        for (const [key, value] of Object.entries(lightModeColors)) {
          root.style.setProperty(`--color-${key}`, value)
        }
      }
      
      function removeLightModeColors() {
        const root = document.documentElement
        for (const key of Object.keys(lightModeColors)) {
          root.style.removeProperty(`--color-${key}`)
        }
      }
      
      window.applyThemeColors = (isDarkMode) => {
        if (isDarkMode) {
          removeLightModeColors()
        } else {
          applyLightModeColors()
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
